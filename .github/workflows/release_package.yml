name: Release package
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      RELEASE_TYPE: ${{ inputs.release-type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run build:oltest

      - name: Git configuration
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Bump version
        run: |
          if [[ "$RELEASE_TYPE" == pre* ]]; then
            NEW_TAG=$(pnpm version --no-git-tag-version --preid=beta "$RELEASE_TYPE")
            echo "NPM_DIST_TAG=beta" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            NEW_TAG=$(pnpm version --no-git-tag-version "$RELEASE_TYPE")
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "NEW_VERSION=${NEW_TAG#v}" >> "$GITHUB_ENV"

      # Moves the "## Unreleased" entries under a new "## <version> - <date>" heading
      # and saves them as the GitHub release notes. Fails if there are no entries.
      - name: Update changelog
        run: |
          export RELEASE_DATE=$(date -u +%F)
          perl -0777 -i -pe '
            /^## Unreleased[ \t]*\n(.*?)(?=^## |\z)/ms or die "No \"## Unreleased\" section in CHANGELOG.md\n";
            my $notes = $1;
            $notes =~ s/^\s+|\s+$//g;
            die "\"## Unreleased\" section in CHANGELOG.md is empty\n" unless length $notes;
            open my $fh, ">", "$ENV{RUNNER_TEMP}/release-notes.md" or die $!;
            print $fh "$notes\n";
            close $fh;
            s/^## Unreleased[ \t]*\n/## Unreleased\n\n## $ENV{NEW_VERSION} - $ENV{RELEASE_DATE}\n/m;
          ' CHANGELOG.md
          pnpm exec prettier -w CHANGELOG.md package.json

      - name: Commit and tag
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore: release $NEW_VERSION"
          git tag -a "$NEW_TAG" -m "$NEW_VERSION"

      # Push before publishing, so npm never gets a version that isn't on GitHub
      - name: Push commit and tag
        run: git push --atomic origin HEAD "$NEW_TAG"

      # No token: npm authenticates through the trusted publisher (OIDC) configured on npmjs.com,
      # and adds provenance automatically
      - name: Publish to npm
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.NEW_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
